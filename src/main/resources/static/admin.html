<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Panel del restaurante</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
    <link rel="stylesheet" href="/css/estilos.css?v=20261110-2">
</head>
<body>

    <aside class="lateral">
        <div class="lateral-marca">
            <div class="marca-icono">CS</div>
            <div><strong id="adminNombre">Casa Sabor</strong>
            <small>Administración del restaurante</small></div>
        </div>

        <nav aria-label="Secciones del panel">
            <button type="button" data-pagina="inicio" onclick="cargarPagina('inicio')"><span>⌂</span> Resumen</button>
            <button type="button" data-pagina="pedidos" onclick="cargarPagina('pedidos')"><span>▤</span> Pedidos</button>
            <button type="button" data-pagina="productos" onclick="cargarPagina('productos')"><span>🍽</span> Menú y productos</button>
            <button type="button" data-pagina="categorias" onclick="cargarPagina('categorias')"><span>▦</span> Categorías</button>
            <button type="button" data-pagina="clientes" onclick="cargarPagina('clientes')"><span>♙</span> Clientes</button>
        </nav>

        <a class="ver-sitio" href="/">Ver el sitio del restaurante</a>
        <form action="/logout" method="post" class="salir-form">
            <button type="submit" class="salir-btn"><span>↪</span> Cerrar sesión</button>
        </form>
    </aside>

    <main class="zona-admin">
        <header class="barra-superior">
            <div><span class="sobrelinea">CASA SABOR · GESTIÓN</span><strong>Panel de administración</strong></div>
            <div class="estado-admin"><span class="punto-online"></span> Sesión administrativa activa</div>
        </header>
        <div id="contenido">Cargando...</div>
        <footer class="pie-admin">Casa Sabor <span>·</span> Sistema de gestión del restaurante</footer>
    </main>

    <script src="/js/config.js"></script>
    <script>
        if (window.RESTAURANTE && window.RESTAURANTE.nombre) {
            document.getElementById("adminNombre").textContent = window.RESTAURANTE.nombre;
        }
    </script>
    <script src="/js/dashboard.js"></script>
    <script src="/js/productos.js"></script>
    <script src="/js/categorias.js"></script>
    <script src="/js/clientes.js"></script>
    <script src="/js/pedidos.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
