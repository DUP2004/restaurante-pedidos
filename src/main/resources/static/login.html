<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Acceso administrador | Casa Sabor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--ink:#28231f;--muted:#81766d;--cream:#f8f4ed;--paper:#fffdfa;--accent:#9d4937;--accent-dark:#783526;--line:#e8ded2}
        *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 10%,#f0dfcc 0,transparent 34%),radial-gradient(circle at 90% 90%,#e8d2bf 0,transparent 35%),var(--cream);font-family:'DM Sans',sans-serif;color:var(--ink)}
        .login{width:min(100%,430px);background:var(--paper);border:1px solid rgba(120,80,55,.12);border-radius:24px;padding:38px;box-shadow:0 24px 70px #553b2817}
        .marca{width:54px;height:54px;display:grid;place-items:center;background:#f1e2d6;border-radius:17px;font-size:26px;margin-bottom:24px}
        .eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700;color:var(--accent)}h1{font-family:'Bricolage Grotesque',sans-serif;font-size:34px;line-height:1.1;letter-spacing:-.04em;margin:9px 0 10px}p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 27px}
        label{display:block;font-size:13px;font-weight:700;margin:17px 0 8px}input{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 14px;font:inherit;background:#fff;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #9d49371c}
        button{width:100%;height:49px;margin-top:23px;border:0;border-radius:11px;background:var(--accent);color:white;font:700 14px 'DM Sans',sans-serif;cursor:pointer;transition:.2s}button:hover{background:var(--accent-dark);transform:translateY(-1px)}
        .mensaje{margin-top:16px;padding:11px 12px;border-radius:10px;font-size:13px;line-height:1.5}.error{background:#fff0ed;color:#9a3024}.salida{background:#edf7ef;color:#28623a}.volver{display:block;text-align:center;margin-top:23px;color:var(--muted);font-size:13px;text-decoration:none}.volver:hover{color:var(--accent)}.seguridad{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:22px;color:#93877b;font-size:11px}
        @media(max-width:480px){.login{padding:28px 23px;border-radius:20px}h1{font-size:30px}}
    </style>
</head>
<body>
    <main class="login">
        <div class="marca" aria-hidden="true">🍽️</div>
        <div class="eyebrow">Casa Sabor · Administración</div>
        <h1>Qué bueno verte.</h1>
        <p>Inicia sesión para administrar los productos, las categorías y los pedidos del restaurante.</p>
        <form action="/login" method="post">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" autocomplete="username" placeholder="Ingresa tu usuario" required autofocus>
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required>
            <button type="submit">Ingresar al panel <span aria-hidden="true">→</span></button>
        </form>
        <div id="mensaje" aria-live="polite"></div>
        <a class="volver" href="/">← Volver al sitio del restaurante</a>
        <div class="seguridad">▣ Acceso restringido al personal autorizado</div>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const mensaje = document.getElementById('mensaje');
        if (params.has('error')) {
            mensaje.className = 'mensaje error';
            mensaje.textContent = 'El usuario o la contraseña no son correctos. Inténtalo nuevamente.';
        } else if (params.has('logout')) {
            mensaje.className = 'mensaje salida';
            mensaje.textContent = 'Has cerrado sesión correctamente.';
        }
    </script>
</body>
</html>
