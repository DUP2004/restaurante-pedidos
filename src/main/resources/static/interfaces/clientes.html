<section id="clientes" class="seccion">

    <h2>Gestión de Clientes</h2>


    <div class="acciones-superiores">

        <button class="btn" onclick="mostrarFormularioCliente()">
            + Nuevo cliente
        </button>

        <button class="btn" onclick="cargarClientes()">
            Actualizar clientes
        </button>

    </div>


    <!-- FORMULARIO -->

    <div id="formularioCliente" class="formulario oculto">

        <h3 id="tituloFormularioCliente">
            Nuevo cliente
        </h3>


        <input
            type="hidden"
            id="clienteId"
        >


        <div class="campo">

            <label>Nombre</label>

            <input
                type="text"
                id="clienteNombre"
                placeholder="Ejemplo: Juan"
            >

        </div>


        <div class="campo">

            <label>Apellido</label>

            <input
                type="text"
                id="clienteApellido"
                placeholder="Ejemplo: Pérez"
            >

        </div>


        <div class="campo">

            <label>Correo</label>

            <input
                type="email"
                id="clienteCorreo"
                placeholder="Ejemplo: juan@email.com"
            >

        </div>


        <div class="campo">

            <label>Teléfono</label>

            <input
                type="text"
                id="clienteTelefono"
                placeholder="Ejemplo: 999999999"
            >

        </div>


        <button class="btn" onclick="guardarCliente()">
            Guardar
        </button>


        <button
            class="btn btn-cancelar"
            onclick="cancelarFormularioCliente()"
        >
            Cancelar
        </button>

    </div>


    <!-- LISTA -->

    <div id="listaClientes" class="contenedor">

        Cargando clientes...

    </div>

</section>
