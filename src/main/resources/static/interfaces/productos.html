<section id="productos" class="seccion">

    <h2>Gestión de Productos</h2>


    <div class="acciones-superiores">

        <button class="btn" onclick="mostrarFormularioProducto()">
            + Nuevo producto
        </button>

        <button class="btn" onclick="cargarProductos()">
            Actualizar productos
        </button>

    </div>


    <!-- FORMULARIO -->

    <div id="formularioProducto" class="formulario oculto">

        <h3 id="tituloFormularioProducto">
            Nuevo producto
        </h3>

        <input type="hidden" id="productoId">


        <div class="campo">

            <label>Nombre</label>

            <input
                type="text"
                id="productoNombre"
                placeholder="Ejemplo: Hamburguesa Doble"
            >

        </div>


        <div class="campo">

            <label>Descripción</label>

            <textarea
                id="productoDescripcion"
                placeholder="Descripción del producto"
            ></textarea>

        </div>


        <div class="campo">

            <label>Precio</label>

            <input
                type="number"
                id="productoPrecio"
                step="0.01"
                min="0"
                placeholder="Ejemplo: 15.90"
            >

        </div>


        <div class="campo">

            <label>Categoría</label>

            <select id="productoCategoria">

                <option value="">
                    Seleccione una categoría
                </option>

            </select>

        </div>


        <div class="campo-checkbox">

            <input
                type="checkbox"
                id="productoDisponible"
                checked
            >

            <label for="productoDisponible">
                Producto disponible
            </label>

        </div>


        <button class="btn" onclick="guardarProducto()">
            Guardar
        </button>


        <button
            class="btn btn-cancelar"
            onclick="cancelarFormularioProducto()"
        >
            Cancelar
        </button>

    </div>


    <!-- LISTA -->

    <div id="listaProductos" class="contenedor">

        Cargando productos...

    </div>

</section>
