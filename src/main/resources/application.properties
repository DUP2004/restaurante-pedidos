spring.application.name=restaurante-pedidos
# Render y otros proveedores asignan el puerto mediante PORT.
server.port=${PORT:8080}

# En local se usa MySQL en localhost. En despliegue se define SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurante_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Para demostración se mantiene update. En producción formal, usar migraciones versionadas.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Datos de demostración: data.sql solo inserta si las tablas están vacías.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# Valores por defecto únicamente para desarrollo local.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Límites de seguridad para la carga de imágenes de productos.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
