spring.application.name=restaurante-pedidos
server.port=8080

# createDatabaseIfNotExist=true crea la BD sola si no existe
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_pedidos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Carga platos de ejemplo (data.sql) solo si las tablas estan vacias
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# Credenciales del administrador (puedes cambiarlas mediante variables de entorno)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
